# Ejemplo de configuración nginx para Paletta en una VPS.
# Copiar a /etc/nginx/sites-available/paletta, ajustar dominio y rutas, y habilitar:
#   sudo ln -s /etc/nginx/sites-available/paletta /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d paletta.com.ar -d www.paletta.com.ar

server {
    listen 80;
    server_name paletta.com.ar www.paletta.com.ar;

    # Build del frontend (npm run build -> frontend/dist)
    root /var/www/paletta/frontend/dist;
    index index.html;

    # Debe ser >= UPLOAD_MAX_MB del backend
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API -> Node (pm2)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes subidas desde el panel: nginx las sirve directo del disco
    location /uploads/ {
        alias /var/www/paletta/backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Assets con hash de Vite: cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
