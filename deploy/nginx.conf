# nginx para Paletta (www.paletta.com.ar)
# Instalación:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/paletta
#   sudo ln -s /etc/nginx/sites-available/paletta /etc/nginx/sites-enabled/paletta
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.paletta.com.ar -d paletta.com.ar --redirect
# certbot agrega solo el bloque HTTPS y la redirección de http -> https.

server {
    listen 80;
    listen [::]:80;
    server_name www.paletta.com.ar paletta.com.ar;

    # Dominio canónico: www
    if ($host = paletta.com.ar) {
        return 301 https://www.paletta.com.ar$request_uri;
    }

    root /var/www/paletta/frontend/dist;
    index index.html;

    # Debe ser >= UPLOAD_MAX_MB del backend
    client_max_body_size 6m;
    server_tokens off;

    # Cabeceras de seguridad. OJO: un add_header dentro de un location anula los del server,
    # por eso los location que agregan cabeceras propias vuelven a incluir este bloque.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API -> Node (pm2, puerto 3000 solo en localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Imágenes subidas desde el panel (las sirve nginx directo del disco)
    location /uploads/ {
        alias /var/www/paletta/backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Assets con hash de Vite: cache de un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # index.html nunca se cachea (así cada deploy se ve al instante)
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
